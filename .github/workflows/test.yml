name: test
on:
  workflow_call:
    inputs:
      haxe:
        required: true
        type: string
      arch:
        required: true
        type: string
      ext:
        required: true
        type: string
      os:
        required: true
        type: string

env:
  HXCPP_ARCH_FLAG: ${{ inputs.arch == 'Arm64' && 'HXCPP_ARM64' || format('HXCPP_M{0}', inputs.arch) }}

defaults:
  run:
    shell: bash

# Tests are grouped into a few jobs per platform to avoid paying the setup cost for each of them.
# Within a job, each test step runs as long as setup succeeded, so one failing test doesn't hide the others.
jobs:
  runtime:
    runs-on: ${{ inputs.os }}
    name: runtime tests
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        id: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
          arch: ${{ inputs.arch }}
      - name: setup mariadb
        if: runner.os == 'Linux'
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy mariadb-server
          sudo systemctl start mariadb
          sudo mariadb -u root -e "create database hxcpp; grant all privileges on hxcpp.* to hxcpp@localhost identified by 'hxcpp'; flush privileges;"

      - name: haxe
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/haxe
        run: |
          set -x
          haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
          bin/TestMain

      - name: std
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/std
        run: |
          set -x
          haxe compile${{ inputs.arch }}.hxml
          ${{ inputs.arch == 'Arm64' && 'arm64' || format('cpp{0}', inputs.arch) }}/Test

      - name: native
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/native
        run: |
          set -x
          haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
          bin/Native

      - name: regression
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/regression
        run: haxe --run Run -D ${{ env.HXCPP_ARCH_FLAG }}

  tools:
    runs-on: ${{ inputs.os }}
    name: tooling tests
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        id: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
          arch: ${{ inputs.arch }}

      - name: cffi
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/cffi
        run: |
          set -x
          (cd project && haxelib run hxcpp build.xml -Ddebug -D${{ env.HXCPP_ARCH_FLAG }})
          haxe compile.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
          haxe compile-utf8.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
          haxe compile-neko.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
          cp project/ndll/*/prime${{ inputs.ext }} bin/neko/prime.ndll
          bin/cpp/TestMain-debug
          bin/cpp-utf8/TestMain-debug
          if [ "${{ inputs.arch }}" = "64" ]; then
            (cd bin/neko && neko TestMain.n)
          fi

      - name: telemetry (debug)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/telemetry
        run: |
          set -x
          haxe compile.hxml -debug -D ${{ env.HXCPP_ARCH_FLAG }}
          bin/TestMain-debug

      - name: telemetry (release)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/telemetry
        run: |
          set -x
          haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
          bin/TestMain

      - name: telemetry (tracy compile)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/telemetry
        run: |
          set -x
          haxe compile.hxml -D HXCPP_TRACY -D HXCPP_STACK_LINE -D ${{ env.HXCPP_ARCH_FLAG }}

      - name: debugger
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/debugger
        run: |
          set -x
          haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
          bin/App-debug

      - name: build tool
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: test/tools
        run: |
          set -x
          # some tests include only xml or only hxml, so do not error if a type doesn't exist
          shopt -s nullglob
          for dir in */; do
            pushd $dir
            for xml in *.xml; do
              haxelib run hxcpp $xml
              haxelib run hxcpp $xml clean
            done
            for hxml in *.hxml; do
              haxe $hxml
            done
            popd
          done

  cppia:
    runs-on: ${{ inputs.os }}
    name: cppia
    defaults:
      run:
        shell: bash
        working-directory: test/cppia
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
          arch: ${{ inputs.arch }}
      - name: build host
        run: haxe compile-host.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: build client
        run: haxe compile-client.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run (interp)
        id: interp
        run: bin/CppiaHost bin/client.cppia
      - name: run (jit)
        if: ${{ !cancelled() && steps.interp.outcome != 'skipped' }}
        run: bin/CppiaHost bin/client.cppia -jit

  suite:
    runs-on: ${{ inputs.os }}
    name: haxe test suite
    defaults:
      run:
        shell: bash
        working-directory: haxe/tests/unit
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
          arch: ${{ inputs.arch }}
      - name: Get Haxe commit SHA
        if: inputs.haxe == 'latest'
        id: haxe_sha
        working-directory:
          ${{github.workspace}}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(haxe --version)
          short_sha=${version##*+}
          full_sha=$(gh api repos/HaxeFoundation/haxe/commits/$short_sha --jq '.sha')
          echo "Haxe version: $version"
          echo "sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "Commit SHA: $short_sha, Full SHA: $full_sha"
      - name: checkout haxe (latest)
        if: inputs.haxe == 'latest'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.haxe_sha.outputs.sha }}
          repository: HaxeFoundation/haxe
          path: haxe
      - name: checkout haxe (stable)
        if: inputs.haxe != 'latest'
        uses: actions/checkout@v7
        with:
          repository: HaxeFoundation/haxe
          path: haxe
          ref: ${{ inputs.haxe }}
      - name: install haxe libs
        run: haxelib install compile-cpp.hxml --always
        # haxe 4 tests don't build with latest utest
        if: inputs.haxe != 'latest'
      - name: build
        run: haxe compile-cpp.hxml -D ${{ env.HXCPP_ARCH_FLAG }} -D no_http
      - name: run
        run: bin/cpp/TestMain-debug
